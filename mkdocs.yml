# Build with `pixi run -e docs docs-build`; the runner stages root manuals.
site_name: Blueforge
site_description: A desktop application for laser cutting and engraving
site_author: Yuri Schmaltz

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - User Manual: USER_MANUAL.md
  - Developer Guide: DEVELOPER_GUIDE.md
  - Documentation: docs/INDEX.md
  - Project status: docs/PROJECT_STATUS.md
  - Installation: docs/INSTALLATION.md
  - Building: docs/BUILDING.md
  - Release process: docs/RELEASE.md
  - Changelog: CHANGELOG.md
  - Support: SUPPORT.md
  - Contributing: CONTRIBUTING.md
  - License: LICENSE.md

extra:
  generator: false
