name: Build documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1
          frozen: true
          environments: docs
          cache: true
      - name: Build documentation
        run: pixi run --frozen -e docs docs-build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: site/
          if-no-files-found: error
          retention-days: 7
